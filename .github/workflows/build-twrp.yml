name: Build TWRP for Pixel 10 Pro XL (mustang)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device and Vendor Trees
        uses: actions/checkout@v4
        with:
          path: local_trees

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /var/lib/docker
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python3-pip rsync libssl-dev bc lz4 \
            libelf-dev ccache

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize TWRP Manifest
        run: |
          mkdir -p twrp
          cd twrp
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Place Device and Vendor Trees
        run: |
          mkdir -p twrp/device/google/mustang
          mkdir -p twrp/vendor/google/mustang
          cp -r local_trees/device/google/mustang/* twrp/device/google/mustang/
          cp -r local_trees/vendor/google/mustang/* twrp/vendor/google/mustang/

      - name: Build Recovery Image
        run: |
          # Clean broken VTS include from minimal manifest
          rm -f twrp/frameworks/base/services/core/xsd/vts/Android.mk

          # Patch AOSP Makefile to prevent rsync collision on root/vendor symlink
          sed -i 's/--exclude=cache/--exclude=cache --exclude=\/root\/vendor/g' twrp/build/make/core/Makefile

          # Ensure mkbootimg receives --header_version 4 for vendor_boot v4
          sed -i 's/mkbootimg --pagesize/mkbootimg --header_version 4 --pagesize/g' twrp/build/make/core/Makefile

          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_mustang-eng || lunch omni_mustang-eng
          mka vendorbootimage -j$(nproc --all)

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-mustang-vendor_boot
          path: twrp/out/target/product/mustang/vendor_boot.img
          if-no-files-found: warn
